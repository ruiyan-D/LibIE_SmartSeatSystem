<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>智座空间</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="main-page">
  <header class="header">
    <h1 class="title">智座空间</h1>
    <div class="info-box">
      <p class="small-text">*安静分贝 0~50 dB，嘈杂 50~80 dB</p>
      <div class="dropdown-container">
        <div class="dropdown">
          <button class="dropbtn">优先级 ⮟</button>
          <div class="dropdown-content">
            <div class="dropdown-item" onclick="selectPriority('available')">✅ 有座</div>
            <div class="dropdown-item" onclick="selectPriority('quiet')">🔇 无声</div>
            <div class="dropdown-item submenu">
              🔥 热门区域 ▶
              <div class="submenu-content">
                <div onclick="window.location.href='hot_area_today.html'">📊 今日</div>
                <div onclick="selectPriority('hot_area_week')">🗓️ 历史1周</div>
                <div onclick="selectPriority('hot_area_month')">📆 历史1月</div>
              </div>
            </div>
            <div class="dropdown-item submenu">
              ⏰ 热门时段 ▶
              <div class="submenu-content">
                <div onclick="window.location.href='hot_time_today.html'">🗓️ 历史1天</div>
                <div onclick="selectPriority('hot_time_month')">📆 历史1月</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <hr class="divider" />

  <main class="main">
    <div class="card">
      <h2>教学楼</h2>

      <div class="room">
        <a href="room.html?room=1" class="room-number">101</a>
        <div class="room-info">
          <span class="room-detail" id="room-101-detail">容量: 3/45</span>
          <a class="time-link" href="/hot-times/0" style="font-size: 16px;">查看热门时段</a>
        </div>
      </div>
      <hr />

      <div class="room">
        <a href="room.html?room=2" class="room-number">102</a>
        <div class="room-info">
          <span class="room-detail" id="room-102-detail">容量: 1/40</span>
          <a class="time-link" href="/hot-times/1" style="font-size: 16px;">查看热门时段</a>
        </div>
      </div>
      <hr />

      <div class="room">
        <a href="room.html?room=3" class="room-number">203</a>
        <div class="room-info">
          <span class="room-detail" id="room-203-detail">容量: 38/40</span>
          <a class="time-link" href="/hot-times/2" style="font-size: 16px;">查看热门时段</a>
        </div>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script>
    // 新增：动态获取容量和噪声状态
    const roomMap = {
      '101': { camera: 'camera_0', detailId: 'room-101-detail' },
      '102': { camera: 'camera_1', detailId: 'room-102-detail' },
      '203': { camera: 'camera_2', detailId: 'room-203-detail' },
    };
    async function updateRoomDetails() {
      // 获取容量
      const summaryRes = await fetch('/api/summary?_t=' + Date.now());
      const summary = await summaryRes.json();
      // 获取噪声
      const noiseRes = await fetch('/api/noise_status?_t=' + Date.now());
      const noise = await noiseRes.json();
      for (const [room, info] of Object.entries(roomMap)) {
        let cap = '--';
        if (summary && summary[info.camera]) {
          cap = `${summary[info.camera].occupied}/${summary[info.camera].total}`;
        }
        // 保证噪声文本始终为“安静”或“嘈杂”
        let noiseText = '安静'; // 默认安静
        if (noise && noise.data && noise.data[info.camera] && noise.data[info.camera].status) {
          noiseText = noise.data[info.camera].status;
        }
        document.getElementById(info.detailId).textContent = `容量: ${cap} | ${noiseText}`;
      }
    }
    updateRoomDetails();
    setInterval(updateRoomDetails, 2000);
  </script>
</body>
</html>
