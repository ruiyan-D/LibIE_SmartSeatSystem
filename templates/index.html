<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>智座空间</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="main-page">
  <header class="header">
    <h1 class="title">智座空间</h1>
    <div class="info-box">
      <p class="small-text">*安静分贝 0~50 dB，嘈杂 50~80 dB</p>
      <div class="dropdown-container">
        <div class="dropdown">
          <button class="dropbtn">优先级 ⮟</button>
          <div class="dropdown-content">
            <div class="dropdown-item" onclick="selectPriority('available')">✅ 有座</div>
            <div class="dropdown-item" onclick="selectPriority('quiet')">🔇 无声</div>
            <div class="dropdown-item submenu">
              🔥 热门区域 ▶
              <div class="submenu-content">
                <div onclick="window.location.href='hot_area_today.html'">📊 今日</div>
                <div onclick="selectPriority('hot_area_week')">🗓️ 历史1周</div>
                <div onclick="selectPriority('hot_area_month')">📆 历史1月</div>
              </div>
            </div>
            <div class="dropdown-item submenu">
              ⏰ 热门时段 ▶
              <div class="submenu-content">
                <div onclick="window.location.href='hot_time_today.html'">🗓️ 历史1天</div>
                <div onclick="selectPriority('hot_time_month')">📆 历史1月</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <hr class="divider" />

  <main class="main">
    <div class="card">
      <h2>教学楼</h2>

      <div class="room">
        <a href="room.html?room=1" class="room-number">101</a>
        <div class="room-info">
          <span class="room-detail" id="room-101-detail">容量: 3/45 | 安静</span>
          <a class="time-link" href="/hot-times/0" style="font-size: 16px;">查看热门时段</a>
        </div>
      </div>
      <hr />

      <div class="room">
        <a href="room.html?room=2" class="room-number">102</a>
        <div class="room-info">
          <span class="room-detail" id="room-102-detail">容量: 1/40 | 嘈杂</span>
          <a class="time-link" href="/hot-times/1" style="font-size: 16px;">查看热门时段</a>
        </div>
      </div>
      <hr />

      <div class="room">
        <a href="room.html?room=3" class="room-number">203</a>
        <div class="room-info">
          <span class="room-detail" id="room-203-detail">容量: 38/40 | 嘈杂</span>
          <a class="time-link" href="/hot-times/2" style="font-size: 16px;">查看热门时段</a>
        </div>
      </div>
    </div>
    <div id="multi-noise-status" style="margin-top: 30px;"></div>
  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script>
    async function fetchNoiseStatus() {
      try {
        const res = await fetch('/api/noise_status?_t=' + Date.now());
        const data = await res.json();
        console.log('noise_status返回', data);
        const container = document.getElementById('multi-noise-status');
        container.innerHTML = '';
        if (data && data.data) {
          for (const [classroom, info] of Object.entries(data.data)) {
            let status = info.status;
            let div = document.createElement('div');
            div.style.display = 'inline-block';
            div.style.margin = '0 20px 10px 0';
            div.style.padding = '12px 30px';
            div.style.fontSize = '22px';
            div.style.fontWeight = 'bold';
            div.style.borderRadius = '12px';
            div.style.boxShadow = '0 0 8px rgba(0,0,0,0.08)';
            div.style.minWidth = '120px';
            div.style.textAlign = 'center';
            if (status === '安静') {
              div.textContent = `${classroom}：安静`;
              div.style.background = 'rgba(200,255,200,0.7)';
              div.style.color = '#228B22';
              div.style.border = '2px solid #228B22';
            } else if (status === '嘈杂') {
              div.textContent = `${classroom}：嘈杂`;
              div.style.background = 'rgba(255,200,200,0.7)';
              div.style.color = '#B22222';
              div.style.border = '2px solid #B22222';
            } else {
              div.textContent = `${classroom}：--`;
              div.style.background = 'rgba(255,255,255,0.7)';
              div.style.color = '#222';
              div.style.border = '2px solid #ccc';
            }
            container.appendChild(div);
          }
        }
      } catch (err) {
        const container = document.getElementById('multi-noise-status');
        container.innerHTML = '<div style="background:rgba(255,255,255,0.7);color:#222;border:2px solid #ccc;padding:12px 30px;border-radius:12px;display:inline-block;">噪声状态获取失败</div>';
      }
    }
    fetchNoiseStatus();
    setInterval(fetchNoiseStatus, 2000);
  </script>
</body>
</html>
