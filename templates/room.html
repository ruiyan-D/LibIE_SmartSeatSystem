<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>教室座位详情</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("/static/images/bg_main.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    .header {
      background: #333;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
    }

    .header h1 {
      font-size: 28px;
      margin: 0;
    }

    .decibel {
      font-size: 14px;
      text-align: right;
    }

    .main {
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px 50px;
      width: 90%;
      max-width: 1000px; /* 加宽容器 */
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .seats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .seat {
      width: 65px; /* 缩小座位宽度 */
      height: 65px; /* 缩小座位高度 */
      border-radius: 10px; /* 减小圆角 */
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 14px; /* 减小字体大小 */
      cursor: pointer;
    }

    .occupied { background: red; }
    .item_only { background: orange; }
    .empty { background: green; }

    .legend {
      margin-top: 30px; /* 减小图例上边距 */
      display: inline-block;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 25px; /* 减小内边距 */
      border-radius: 14px; /* 减小圆角 */
      font-size: 13px; /* 减小字体大小 */
    }

    .legend span {
      display: inline-block;
      margin: 0 8px; /* 减小间距 */
    }

    .legend .color-box {
      display: inline-block;
      width: 12px; /* 减小尺寸 */
      height: 12px; /* 减小尺寸 */
      margin-right: 4px; /* 减小间距 */
      border-radius: 2px; /* 减小圆角 */
    }

    .back-btn {
      margin-top: 15px; /* 减小上边距 */
      display: inline-block;
      background: #4a90e2;
      color: white;
      padding: 7px 18px; /* 减小内边距 */
      border-radius: 6px; /* 减小圆角 */
      text-decoration: none;
      transition: background 0.3s;
      font-size: 14px; /* 减小字体大小 */
    }

    .back-btn:hover {
      background: #357ab7;
    }

    /* 新添加的样式 */
    .row-container {
      margin-bottom: 10px !important; /* 减小排间距 */
    }

    .row-label {
      margin-bottom: 5px !important; /* 减小排标签下边距 */
    }

  </style>
</head>
<body>

  <!-- 顶栏 -->
  <div class="header">
    <h1>教室 101 座位详情</h1>
    <div class="decibel">实时分贝：45 dB</div>
  </div>

  <!-- 内容区 -->
  <div class="main">
    <div class="card">
      <!-- 这里动态生成座位 -->
      <div class="seats" id="seats"></div>

      <!-- 底部颜色说明 -->
      <div class="legend">
        <span><span class="color-box" style="background: green;"></span> 空闲</span>
        <span><span class="color-box" style="background: red;"></span> 占用</span>
        <span><span class="color-box" style="background: orange;"></span> 物品占座</span>
      </div>

      <!-- 返回主页按钮 -->
      <br>
      <a href="{{ url_for('index') }}" class="back-btn">返回主页</a>

    </div>
  </div>
<script>
const roomToCamera = {
  "1": "camera_0",
  "2": "camera_1",
  "3": "camera_2"
};
const cameraToRoom = {
  "camera_0":  "101",
  "camera_1":  "102",
  "camera_2":  "203"
};
const params = new URLSearchParams(location.search);
const room = params.get("room");
const cameraId = roomToCamera[room];
const roomName = cameraToRoom[cameraId];
document.querySelector('.header h1').textContent = `教室 ${roomName} 座位详情`;

function loadSeatStatus() {
  fetch(`/api/seat_status_raw/${cameraId}`)
    .then(res => res.json())
    .then(data => {
      const seatsDiv = document.getElementById('seats');
      seatsDiv.innerHTML = "";

      // 将排号转换为数字进行排序
      const sortedRows = Object.entries(data).sort((a, b) => {
        const rowA = parseInt(a[0]);
        const rowB = parseInt(b[0]);
        return rowB - rowA; // 从大到小排序（R2在R1上方）
      });

      // 创建主容器
      const mainContainer = document.createElement('div');
      mainContainer.style.display = 'flex';
      mainContainer.style.flexDirection = 'column';
      mainContainer.style.alignItems = 'center';
      mainContainer.style.width = '100%';

      sortedRows.forEach(([row, seatList]) => {
        // 每排创建一个行容器
        const rowContainer = document.createElement('div');
        rowContainer.className = 'row-container';
        rowContainer.style.display = 'flex';
        rowContainer.style.flexWrap = 'wrap';
        rowContainer.style.justifyContent = 'center';
        rowContainer.style.marginBottom = '10px'; // 减小排间距
        rowContainer.style.width = '100%';

        // 添加排号标签
        const rowLabel = document.createElement('div');
        rowLabel.className = 'row-label';
        rowLabel.textContent = `第 ${row} 排`;
        rowLabel.style.width = '100%';
        rowLabel.style.textAlign = 'center';
        rowLabel.style.marginBottom = '5px'; // 减小标签下边距
        rowLabel.style.fontWeight = 'bold';
        rowLabel.style.fontSize = '1.1em'; // 减小字体大小
        mainContainer.appendChild(rowLabel);

        // 按x坐标从左到右排序座位
        seatList.sort((s1, s2) => s1.coords[0] - s2.coords[0]);

        seatList.forEach((seat, idx) => {
          const seatDiv = document.createElement('div');
          seatDiv.className = `seat ${seat.status}`;
          seatDiv.textContent = `R${row}_S${idx + 1}`;

          // 添加基本样式（已通过CSS设置尺寸）
          seatDiv.style.margin = '3px'; // 减小座位间距
          seatDiv.style.padding = '5px'; // 减小内边距
          seatDiv.style.cursor = 'pointer';
          seatDiv.style.transition = 'transform 0.2s';
          seatDiv.style.display = 'flex';
          seatDiv.style.alignItems = 'center';
          seatDiv.style.justifyContent = 'center';
          seatDiv.style.textAlign = 'center';

          // 悬停效果
          seatDiv.addEventListener('mouseenter', () => {
            seatDiv.style.transform = 'scale(1.05)';
          });

          seatDiv.addEventListener('mouseleave', () => {
            seatDiv.style.transform = 'scale(1)';
          });

          rowContainer.appendChild(seatDiv);
        });

        mainContainer.appendChild(rowContainer);
      });

      seatsDiv.appendChild(mainContainer);
    });
}

// 页面加载立即执行一次
loadSeatStatus();

// 每 2 秒刷新一次
setInterval(loadSeatStatus, 2000);
</script>

</body>
</html>
