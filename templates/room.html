<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>教室座位详情</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("/static/images/bg_main.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    .header {
      background: #333;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
    }

    .header h1 {
      font-size: 28px;
      margin: 0;
    }

    .decibel {
      font-size: 14px;
      text-align: right;
    }

    .main {
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px 50px;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .seats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .seat {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .occupied { background: red; }
    .item_only { background: orange; }
    .empty { background: green; }

    .legend {
      margin-top: 50px;
      display: inline-block;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px 30px;
      border-radius: 16px;
      font-size: 14px;
    }

    .legend span {
      display: inline-block;
      margin: 0 10px;
    }

    .legend .color-box {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 5px;
      border-radius: 3px;
    }

    .back-btn {
      margin-top: 20px;
      display: inline-block;
      background: #4a90e2;
      color: white;
      padding: 8px 20px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background: #357ab7;
    }

  </style>
</head>
<body>

  <!-- 顶栏 -->
  <div class="header">
    <h1>教室 101 座位详情</h1>
    <div class="decibel">实时分贝：45 dB</div>
  </div>

  <!-- 内容区 -->
  <div class="main">
    <div class="card">
      <!-- 这里动态生成座位 -->
      <div class="seats" id="seats"></div>

      <!-- 底部颜色说明 -->
      <div class="legend">
        <span><span class="color-box" style="background: green;"></span> 空闲</span>
        <span><span class="color-box" style="background: red;"></span> 占用</span>
        <span><span class="color-box" style="background: orange;"></span> 物品占座</span>
      </div>

      <!-- 返回主页按钮 -->
      <br>
      <a href="{{ url_for('index') }}" class="back-btn">返回主页</a>

    </div>
  </div>

  <script>
    // 这是示例，后续可改成从后端拉数据
    const seats = [
      { id: 'seat1', status: 'empty' },
      { id: 'seat2', status: 'occupied' },
      { id: 'seat3', status: 'item_only' },
      { id: 'seat4', status: 'empty' },
      { id: 'seat5', status: 'occupied' },
    ];

    const seatsDiv = document.getElementById('seats');
    seats.forEach(seat => {
      const div = document.createElement('div');
      div.className = `seat ${seat.status}`;
      div.textContent = seat.id;
      seatsDiv.appendChild(div);
    });
  </script>

</body>
</html>
